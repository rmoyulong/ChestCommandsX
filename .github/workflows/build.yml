name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions: write-all

jobs:
  build:
    name: Gradle 编译
    runs-on: ubuntu-latest

    steps:
      - name: 检测系统
        uses: actions/checkout@v4

      - name: 设置Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 设置Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: ./gradlew build

      - name: 上传插件jar
        uses: actions/upload-artifact@v4
        with:
          name: chestcommands-plugin
          path: plugin/build/libs/chestcommands-plugin-*.jar
          
      - name: 生成标签，上传固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ChestcommandsX Plugin
          body: |
            ====================🧊插件信息🧊=======================
            ➦ 📒 插件名称：ChestCommandsX
            ➦ 💻 插件平台：Minecraft
            ➦ ⚽ 插件源码：PolarBearEX-8/ChestCommandsX
          artifacts:  plugin/build/libs/chestcommands-plugin-*.jar
                      
