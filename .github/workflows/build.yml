name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions: write-all

jobs:
  build:
    name: Gradle 编译
    runs-on: ubuntu-latest

    steps:
      - name: 检测系统
        uses: actions/checkout@v4

      - name: 设置Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 设置Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: ./gradlew build

      - name: 检测编译完的插件
        run: |
          mkdir -p upload
          cp -rf plugin/build/libs/chestcommands-plugin-*.jar ./upload/ChestcommandsX.jar
          export CORE_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "CORE_DATE=$CORE_DATE" >> $GITHUB_ENV
        
      - name: 上传插件jar
        uses: actions/upload-artifact@v4
        with:
          name: chestcommands-plugin
          path: plugin/build/libs/chestcommands-plugin-*.jar
 
      - name: 生成标签，上传固件 
        uses: ncipollo/release-action@main
        with:
          tag: ChestcommandsX-Plugins
          artifacts: upload/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          token: GITHUB_TOKEN_$CORE_DATE
          body: |
            ====================🧊插件信息🧊=======================
            ➦ 📒 插件名称：ChestCommandsX
            ➦ 💻 插件平台：Minecraft
            ➦ ⚽ 插件源码：PolarBearEX-8/ChestCommandsX         
                      
