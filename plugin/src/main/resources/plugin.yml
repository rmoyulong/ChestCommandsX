name: ChestCommands
main: me.filoghost.chestcommands.ChestCommands
version: ${pluginVersion}
api-version: '26.1.2'
folia-supported: true
authors: [filoghost, CadsMC]
description: CadsMC 的 ChestCommands 分支.

softdepend: [Vault, PlaceholderAPI]

commands:
   chestcommands:
      description: ChestCommands 的主命令.
      usage: /<command> (启动错误)
      aliases: [cc]
   chestcommands.command.sound:
     description: 允许使用 /cc 音效测试声音.
     default: op

permissions:
  chestcommands.economy.bypass:
    description: 绕过本插件的命令收费.
    default: false